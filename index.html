<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Letter For You ♡</title>
<style>
:root {
  --cream:#fff8ee;
  --pink:#f4dce1;
  --rose:#bd7185;
  --wine:#762e45;
  --ink:#513541;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh;
  background:linear-gradient(145deg,var(--cream),var(--pink));
  color:var(--ink);
  font-family:Georgia, "Tahoma", serif;
  text-align:center;
  overflow-x:hidden;
}
main {
  width:min(92%,650px);
  margin:auto;
  padding:38px 0 65px;
}
h1 { color:var(--wine); font-size:clamp(27px,6vw,42px); }
p { line-height:1.9; }
.small { font-size:13px; opacity:.72; }
button {
  border:0; border-radius:30px;
  padding:12px 20px; margin:6px;
  background:var(--wine); color:white;
  font-size:15px; cursor:pointer;
  transition:transform .2s ease, background .2s ease;
}
button:active { transform:scale(.96); }
button.secondary { background:#ead0d5; color:var(--wine); }

.envelope-wrap { perspective:900px; margin:35px auto; }
.envelope {
  position:relative; width:min(100%,330px); height:205px;
  margin:auto; cursor:pointer;
  background:#dcaab4; border-radius:8px;
  box-shadow:0 12px 28px #762e4520;
}
.envelope:before {
  content:""; position:absolute; inset:0;
  background:#e8bdc6;
  clip-path:polygon(0 0,50% 58%,100% 0);
  transform-origin:top; transition:transform .8s; z-index:3;
}
.envelope:after {
  content:""; position:absolute; inset:0;
  background:#cf8f9f;
  clip-path:polygon(0 100%,0 0,50% 57%,100% 0,100% 100%);
  border-radius:8px;
}
.seal {
  position:absolute; z-index:4; left:50%; top:53%;
  transform:translate(-50%,-50%);
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--wine);color:white;font-size:23px;
  transition:opacity .4s ease;
}
.envelope.open:before { transform:rotateX(180deg); }
.envelope.open .seal { opacity:0; }

.letter {
  display:none; position:relative; z-index:2;
  background:#fffdf8; padding:25px 22px;
  margin:18px auto; border:1px solid #e8cbd0;
  border-radius:12px; box-shadow:0 10px 25px #762e4512;
  text-align:left; animation:appear .8s ease;
}
.letter.show { display:block; }
.letter h2 { text-align:center; color:var(--wine); }
#letterText { white-space:pre-wrap; }

@keyframes appear {
  from {opacity:0;transform:translateY(15px)}
  to {opacity:1;transform:translateY(0)}
}

.section {
  margin-top:25px; padding:22px;
  border:1px solid #e7cbd1; border-radius:18px;
  background:#fff9f3b8;
}
#choiceArea {
  position: relative;
  min-height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}
#noBtn { 
  background:#d7a3ae; color:#54283a; 
  position: relative;
  transition: transform 0.2s ease-out;
}
#status { min-height:30px; color:var(--wine); font-weight: bold; }

/* โครงสร้างส่วนคำถามเชิงลึก (Deep Quiz Section) */
#quizSection {
  display: none;
  text-align: center;
  animation: appear .6s ease;
}
#quizSection.show { display: block; }
.scenario-box {
  background: #ffffff;
  border-left: 4px solid var(--rose);
  padding: 14px 18px;
  margin: 15px 0 20px;
  text-align: left;
  border-radius: 0 12px 12px 0;
  font-size: 14.5px;
  color: #643949;
  box-shadow: 0 4px 12px #762e450a;
}
.scenario-title {
  font-weight: bold;
  color: var(--wine);
  margin-bottom: 6px;
  display: block;
}
.quiz-option {
  display: block;
  width: 100%;
  max-width: 420px;
  margin: 10px auto;
  background: #fff;
  border: 1px solid var(--rose);
  color: var(--wine);
  font-size: 15px;
  padding: 12px 18px;
  line-height: 1.5;
  text-align: left;
  border-radius: 20px;
}
.quiz-option:hover {
  background: var(--wine);
  color: white;
}
.progress-bar {
  font-size: 13px;
  color: var(--rose);
  margin-bottom: 12px;
  font-weight: bold;
}

#ending { display:none; }
#ending.show { display:block; animation:appear .8s; }

.sparkle {
  position:fixed; pointer-events:none; z-index:99;
  animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  from {opacity:1;transform:translateY(0) scale(.6)}
  to {opacity:0;transform:translateY(-90px) scale(1.5)}
}
footer { margin-top:35px; font-size:12px; opacity:.65; }
</style>
</head>
<body>
<main>
  <p>♡ a little letter for someone special ♡</p>
  <h1>ถึงคนคนหนึ่ง</h1>
  <p>มีบางอย่างที่อยากบอก เลยทำเว็บนี้ขึ้นมา</p>

  <div class="envelope-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="เปิดซอง
